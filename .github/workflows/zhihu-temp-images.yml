name: Test Zhihu Markdown import with mainland-facing image CDN

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/zhihu-markdown-export
    paths:
      - .github/workflows/zhihu-temp-images.yml

permissions:
  contents: read

jobs:
  export-and-host:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install plot and CJK font dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --user numpy matplotlib
          bash scripts/import-notes.sh
      - name: Generate offline Markdown with seven images
        run: |
          python3 scripts/export-zhihu.py
          python3 -m py_compile scripts/host-zhihu-cn-images.py
          python3 scripts/host-zhihu-cn-images.py
      - name: Upload image batches to CZL domestic host
        run: |
          python3 scripts/host-zhihu-cn-images.py --provider czl --upload
      - name: Validate standalone MD
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('dist/zhihu/uniform-continuity/article.zhihu-cn.md').read_text('utf-8')
          matches = re.findall(r'!\[[^\]]*\]\((https://[^)]+\.png)\)', text)
          assert len(matches) == 7, len(matches)
          assert all(any(domain in url for domain in ['img.czl.net/', 'i.czl.net/', 'esaimg.cdn1.vip/', 'edgeoneimg.cdn1.vip/']) for url in matches), matches
          assert len(re.findall(r'^## ', text, flags=re.M)) == 9
          assert text.count('$$') == 12
          assert not re.search('annouimo|github\.com|blog\.|learn\.|个人网站|阅读原文', text, re.I)
          print('Validated: 7 external PNGs, 9 headings, 6 display equations, 0 personal links')
          PY
      - name: Save Markdown artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhihu-mainland-image-md
          path: |
            dist/zhihu/uniform-continuity/article.zhihu-cn.md
            dist/zhihu/uniform-continuity/hosted-images-*.json
          retention-days: 3
          if-no-files-found: error
