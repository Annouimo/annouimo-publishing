name: Zhihu image host quality comparison (one image)
on:
  push:
    branches:
      - experiment/zhihu-markdown-export
    paths:
      - .github/workflows/zhihu-scdn-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare original chart
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          python3 -m pip install --user numpy matplotlib pillow
          bash scripts/import-notes.sh
          python3 scripts/export-zhihu.py
      - name: Upload original PNG to SCDN's mainland CDN
        run: |
          curl --fail --show-error --silent --retry 2 --retry-delay 3 --max-time 45 \
            -F "image=@dist/zhihu/uniform-continuity/images/square.png;type=image/png" \
            -F "outputFormat=png" \
            -F "cdn_domain=esaimg.cdn1.vip" \
            https://img.scdn.io/api/v1.php > /tmp/scdn-response.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/scdn-response.json'))
          if not data.get('success'):
              raise RuntimeError('Image host rejected input: '+str(data)[:240])
          url=data.get('url')
          if not url or not url.startswith('https://esaimg.cdn1.vip/'):
              raise RuntimeError('Unexpected URL: '+str(url))
          open('/tmp/scdn-url.txt','w').write(url)
          print('SCDN URL:',url)
          PY
      - name: Check delivered image geometry and pixel fidelity
        run: |
          python3 - <<'PY'
          import io, json, math, urllib.request
          import numpy as np
          from PIL import Image
          from pathlib import Path
          src=Path('dist/zhihu/uniform-continuity/images/square.png')
          url=Path('/tmp/scdn-url.txt').read_text()
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=40) as response:
              contents=response.read(10_000_000)
          (src.parent/'square-scdn.png').write_bytes(contents)
          orig=Image.open(src).convert('RGB')
          returned=Image.open(io.BytesIO(contents)).convert('RGB')
          same_size=orig.size == returned.size
          result={'source_px':orig.size,'host_px':returned.size,'source_bytes':src.stat().st_size,
                  'host_bytes':len(contents),'size_unchanged':same_size,'host_url':url}
          if same_size:
              a=np.asarray(orig).astype('float32')
              b=np.asarray(returned).astype('float32')
              diff=np.abs(a-b)
              mse=float(np.mean((a-b)**2))
              result.update({'pixel_mean_absolute_error':round(float(np.mean(diff)),4),
                  'pixel_exact_fraction':round(float(np.mean(np.all(a==b,axis=2))),4),
                  'psnr_db':round(10*math.log10(255*255/mse),2) if mse else 'identical'})
          print('RESULT',json.dumps(result,ensure_ascii=False))
          (src.parent/'scdn-quality-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          if not same_size: raise RuntimeError('SCDN altered pixel dimensions')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zhihu-scdn-quality
          path: |
            dist/zhihu/uniform-continuity/images/square.png
            dist/zhihu/uniform-continuity/images/square-scdn.png
            dist/zhihu/uniform-continuity/images/scdn-quality-result.json
          retention-days: 1
